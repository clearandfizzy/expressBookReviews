services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-book-reviews
    working_dir: /app
    tty: true
    volumes:
      - ./final_project:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules: